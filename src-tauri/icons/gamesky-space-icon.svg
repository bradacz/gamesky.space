<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="shell">
      <rect x="64" y="64" width="896" height="896" rx="176"/>
    </clipPath>
    <pattern id="sky-grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#082d78" stroke-width="3"/>
    </pattern>
  </defs>

  <g clip-path="url(#shell)">
    <rect x="64" y="64" width="896" height="896" fill="#01072b"/>
    <rect x="64" y="64" width="896" height="896" fill="url(#sky-grid)"/>
    <rect x="64" y="64" width="896" height="176" fill="#061b68"/>
    <path d="M64 812H960V960H64Z" fill="#061b68"/>

    <rect x="80" y="80" width="864" height="864" rx="160" fill="none" stroke="#55ffff" stroke-width="16"/>
    <rect x="108" y="108" width="808" height="808" rx="136" fill="none" stroke="#168fbd" stroke-width="8"/>

    <!-- Pixel stars: deliberately asymmetric like a hand-plotted VGA star map. -->
    <g fill="#fff36a">
      <rect x="172" y="168" width="28" height="28"/>
      <rect x="804" y="180" width="20" height="20"/><rect x="744" y="286" width="14" height="14"/>
      <rect x="224" y="316" width="16" height="16"/><rect x="164" y="696" width="20" height="20"/>
    </g>
    <g fill="#55ffff">
      <rect x="268" y="154" width="12" height="12"/><rect x="680" y="152" width="18" height="18"/>
      <rect x="842" y="366" width="12" height="12"/><rect x="770" y="728" width="18" height="18"/>
      <rect x="244" y="770" width="12" height="12"/>
    </g>

    <!-- A low-resolution orbit, built from hard-edged segments. -->
    <path d="M198 584C238 404 382 292 570 292C730 292 842 368 864 466"
      fill="none" stroke="#fff36a" stroke-width="28" stroke-linecap="square"/>
    <path d="M826 512C786 688 642 792 460 792C304 792 194 720 164 628"
      fill="none" stroke="#168fbd" stroke-width="28" stroke-linecap="square"/>
    <rect x="838" y="438" width="58" height="58" fill="#ff4fd8" stroke="#55ffff" stroke-width="10"/>

    <!-- Pixel GS monogram. Each letter is assembled on a 48 px module grid. -->
    <g fill="#55ffff">
      <rect x="280" y="372" width="48" height="240"/>
      <rect x="328" y="324" width="192" height="48"/>
      <rect x="328" y="612" width="192" height="48"/>
      <rect x="424" y="468" width="96" height="48"/>
      <rect x="472" y="468" width="48" height="144"/>
    </g>
    <g fill="#fff36a">
      <rect x="568" y="324" width="192" height="48"/>
      <rect x="568" y="372" width="48" height="144"/>
      <rect x="616" y="468" width="96" height="48"/>
      <rect x="712" y="516" width="48" height="96"/>
      <rect x="568" y="612" width="192" height="48"/>
    </g>

    <!-- .space dot / tiny moon. -->
    <rect x="466" y="718" width="42" height="42" fill="#ff4fd8"/>
    <rect x="478" y="706" width="18" height="66" fill="#ff4fd8"/>

    <path d="M144 208V144H208M816 144H880V208M144 816V880H208M816 880H880V816"
      fill="none" stroke="#fff36a" stroke-width="20"/>
  </g>
</svg>
